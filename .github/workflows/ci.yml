name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails when the committed agent bundle has drifted from core/agent, so no binding can
      # quietly ship a different agent than the one in source.
      - run: npm run bundle:check
      - run: npm run build
      - run: node --test "packages/*/test/**/*.test.ts"

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Runs the same conformance cases as the TypeScript suite.
      - run: swift test --package-path swift

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      # `rust-version` is a claim about what the crates build on, and nothing else here tests it:
      # the runner ships whatever stable is current, so the floor would rot unnoticed.
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --manifest-path rust/Cargo.toml --workspace --all-targets
      # `--all` because the workspace root is virtual: without it rustfmt looks for targets there
      # and finds none.
      - run: cargo fmt --all --check --manifest-path rust/Cargo.toml
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      # Runs the same conformance cases as the TypeScript and Swift suites.
      - run: cargo test --manifest-path rust/Cargo.toml
